[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "styleswin"
version = "0.4.0"
description = "StyleSwin: Transformer-based GAN for high-resolution image generation (WC-Co microstructure fork)"
readme = "README.md"
authors = [{ name = "D.G.Kagramanyan" }]
requires-python = ">=3.12"

# NOTE: torch / torchvision are installed separately from the CUDA wheel index
# (see README). ninja is installed from conda (anaconda::ninja); a pip ninja
# conflicts with it. Neither is listed here on purpose.
dependencies = [
  "numpy>=1.20",
  "click>=8.0",
  "pillow>=8.3.1",
  "scipy>=1.7.1",
  "requests>=2.26.0",
  "tqdm>=4.62.2",
  "psutil>=5.8.0",
  "h5py>=3.0",
  "imageio>=2.9",
  "lmdb",
  "timm>=0.9",          # models/generator.py imports timm.layers (0.9+ only)
  "wandb",
  "tensorboard>=2.10",
  "pyspng>=0.1.1",
]

[project.optional-dependencies]
# combra: optional package (in-training generative-quality metrics).
# Private repo — cloning requires GitHub auth. If you are logged in via the
# GitHub CLI (`gh auth login`, HTTPS protocol), git inherits gh's credential
# helper and the clone works automatically:
#     pip install -e '.[combra]'
# The [metrics] extra is REQUIRED, not optional: combra 0.5.0 moved torch,
# torchvision, pytorch-fid and open-clip-torch out of its base dependencies, so a
# bare `combra` install has no FID / CMMD / FD-DINOv2 backend and those three
# metrics come back nan. combra also floors Python at 3.12, which is why this
# package does too.
# Pinned to a combra tag, not a moving branch. Unpinned, every fresh env
# resolved whatever combra main was that day, so the FID / CMMD / FD-DINOv2 /
# angle numbers a run is judged on could change with no signal and no record.
# Local development is unaffected -- the model envs carry an editable install of
# combra that shadows this URL; the pin governs fresh installs (cluster, CI).
# Bump it deliberately when you want combra's newer behaviour.
combra = ["combra[metrics] @ git+https://github.com/dkagramanyan/combra.git@v0.13.0"]
# dev: lint + the CPU smoke tests (CI installs this extra).
dev = ["ruff", "pytest"]

[project.urls]
Repository = "https://github.com/dkagramanyan/StyleSwin-v2"

# Console commands. The training / generation / eval / data / download entry points
# mirror the shared model-API convention (`<model>-train`, `<model>-gen-images`,
# `<model>-eval`, `<model>-prepare-data`, `<model>-download-models`).
[project.scripts]
styleswin-train = "train:main"
styleswin-gen-images = "gen_images:main"
styleswin-eval = "eval:main"
styleswin-prepare-data = "dataset_tool:prepare_data"
styleswin-download-models = "download_models:main"

# This is a flat script repo (train.py, gen_images.py, loose module dirs), not an
# importable package. The top-level scripts are exposed as py-modules so the console
# scripts above resolve; the explicit list stops setuptools auto-discovery from failing
# on the mixed top-level layout, keeps `pip install -e .` a lightweight editable shell,
# and avoids building the `op` CUDA extensions at install time.
[tool.setuptools]
py-modules = ["train", "gen_images", "eval", "dataset_tool", "download_models"]

# The console scripts above import these sibling package dirs. Without this block
# only the five py-modules are installed, so `styleswin-train` died on
# `No module named 'dnnlib'` and `styleswin-eval` / `styleswin-gen-images` on
# `No module named 'models'` from any cwd but the repo root -- which the sh/*.sh
# launchers do not guarantee. Mirrors the same block in san-v2 and edm2.
[tool.setuptools.packages.find]
include = ["dnnlib*", "models*", "op*", "training*", "torch_utils*", "utils*", "dataset*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
